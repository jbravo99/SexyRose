# SexyRose — producción (servidor).
#
# Uso (desde la raíz del repo):
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Las variables se editan en ../.env (raíz del repo; ver .env.example e infra/gen-env.sh), pero cada
# contenedor recibe solo las suyas: infra/server/separar-env.sh arma ../.env.app, ../.env.db, ../.env.tunnel y ../.env.agente
# (deploy.sh lo corre solo antes de levantar). Así db y cloudflared no ven los secretos del app.
# Nada publica puertos: el tráfico público entra solo por cloudflared (Cloudflare Tunnel),
# que llega al app por la red interna en http://app:3000.

name: sexyrose

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: sexyrose-app:latest
    env_file: ../.env.app   # todo menos POSTGRES_*, TUNNEL_TOKEN y AGE_RECIPIENT (separar-env.sh)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
    # Sin "ports": solo accesible desde cloudflared por la red interna.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Fotos e historias (si STORAGE=local) y archivos privados de verificación. Única carpeta escribible del app.
    volumes:
      - srdata:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    init: true
    logging: *logging

  # Asistente de cuenta por WhatsApp (app/agente.js): misma imagen que el app, otro proceso. Si se cae, el sitio
  # sigue igual. Solo recibe sus variables (../.env.agente: DATABASE_URL, SECRETS_KEY, ANTHROPIC_*, TELEGRAM_*,
  # SITE_URL). Lo prende y apaga Juan desde Admin → Asistente (apagado no se conecta a WhatsApp).
  agente:
    # Mismo build que el app (usa la caché: no se construye dos veces) y misma imagen.
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: sexyrose-app:latest
    command: ["node", "agente.js"]
    env_file: ../.env.agente   # separar-env.sh
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks: [backend, salida]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # Comprobantes que llegan por WhatsApp (DATA_DIR/privado/comprobantes): el mismo volumen que el app.
    volumes:
      - srdata:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    init: true
    # Al recrearlo (deploy) recibe SIGTERM: termina la respuesta en curso, cierra WhatsApp y guarda la sesión antes de
    # salir (app/agente.js corta solo a los 25 s). Con los 10 s por defecto Docker lo mataba a mitad.
    stop_grace_period: 30s
    # Sano = escribió su latido en los últimos 2 minutos (no tiene puerto HTTP).
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');try{process.exit(Date.now()-f.statSync('/tmp/agente-latido').mtimeMs<120000?0:1)}catch(e){process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  db:
    image: postgres:16
    env_file: ../.env.db   # solo POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB (separar-env.sh)
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    shm_size: 256m
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  cloudflared:
    # Imagen oficial de Cloudflare con versión FIJA (la misma que corría en el servidor en noviembre de 2026).
    # Se actualiza a propósito, no sola: elegir un tag de https://hub.docker.com/r/cloudflare/cloudflared/tags,
    # cambiarlo acá y desplegar. Cloudflare da soporte a versiones de hasta ~1 año: revisarlo cada 6 meses.
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ../.env.tunnel   # solo TUNNEL_TOKEN (separar-env.sh)
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    logging: *logging

networks:
  # db + app + agente. Sin salida a internet.
  backend:
    internal: true
  # app + cloudflared. Con salida (cloudflared -> Cloudflare; app -> Telegram).
  edge: {}
  # Solo el agente: salida a WhatsApp, a la API de Claude y a Telegram (no ve a cloudflared ni al app por esta red).
  salida: {}

volumes:
  pgdata:
  srdata:
